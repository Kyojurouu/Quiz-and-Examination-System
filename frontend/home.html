<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>National University | Quiz &amp; Examination System</title>
<link rel="icon" href="assets/nu-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="page">
  <header class="brand-bar">
    <span class="brand-link">
      <img class="brand-mark" src="assets/nu-logo.png" alt="National University crest" />
      <span class="brand-name">National University<small>Quiz &amp; Examination System</small></span>
    </span>
    <div class="brand-sub account-area"><span id="student-label"></span><button type="button" id="logout-btn" class="logout-btn">Logout</button></div>
  </header>

  <main class="content">
    <section class="hero">
      <div class="hero-inner">
        <h1>Welcome, Student!</h1>
        <p>Select a subject to continue.</p>
      </div>
    </section>

    <section class="tile-grid" id="subject-list"></section>
  </main>

  <footer class="page-footer">
    <div class="footer-line">National University &middot; Quiz &amp; Examination System</div>
    <div class="footer-line">Having trouble? See your instructor or proctor before the exam window closes.</div>
  </footer>
</div>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/pages/welcome.js"></script>
</body>
</html>
